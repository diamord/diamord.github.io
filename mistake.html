<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>錯題複習</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Serif TC', serif; background: #fafaf8; color: #2c2c2c; line-height: 1.8; padding: 20px 20px 80px; }
        .container { max-width: 700px; margin: 0 auto; }
        h2 { text-align: center; margin-bottom: 30px; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #666; font-size: 0.95em; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 1em; background: white; }
        textarea { min-height: 100px; resize: vertical; }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #666; }
        .file-wrapper { position: relative; }
        .file-wrapper input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .file-btn { padding: 12px; border: 2px dashed #ccc; border-radius: 6px; text-align: center; cursor: pointer; }
        .file-btn:hover { border-color: #666; background: #f5f5f5; }
        #preview { max-width: 100%; margin-top: 10px; border-radius: 6px; display: none; }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-family: inherit; font-size: 1em; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #2c2c2c; color: white; margin-top: 10px; }
        .btn-primary:hover { background: #1a1a1a; }
        .btn-secondary { background: white; border: 1px solid #ddd; color: #2c2c2c; margin-top: 10px; }
        .btn-secondary:hover { background: #f5f5f5; }
        .filter { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e5e5e5; }
        .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .chip { padding: 8px 16px; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; font-size: 0.95em; }
        .chip:hover { background: #f5f5f5; }
        .chip.active { background: #2c2c2c; color: white; border-color: #2c2c2c; }
        .card { background: white; padding: 24px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e5e5e5; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 0.9em; color: #999; }
        .subject-tag { background: #f0f0f0; padding: 4px 12px; border-radius: 4px; color: #666; font-weight: 600; }
        .card img { max-width: 100%; border-radius: 6px; margin-bottom: 16px; }
        .answer-hidden { display: none; margin-top: 16px; padding: 16px; background: #f9f9f9; border-radius: 6px; }
        .exam-box { background: white; padding: 30px; border-radius: 8px; border: 1px solid #e5e5e5; }
        .exam-header { display: flex; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e5e5e5; }
        .question-img { width: 100%; border-radius: 6px; margin-bottom: 20px; }
        .question-text { font-size: 1.1em; margin-bottom: 24px; white-space: pre-wrap; }
        .options { margin-bottom: 20px; }
        .option { padding: 14px 16px; margin-bottom: 10px; border: 2px solid #e5e5e5; border-radius: 6px; cursor: pointer; display: flex; align-items: flex-start; }
        .option:hover { border-color: #666; background: #fafafa; }
        .option.selected { border-color: #2c2c2c; background: #f5f5f5; }
        .option.correct { border-color: #4caf50; background: #e8f5e9; }
        .option.wrong { border-color: #f44336; background: #ffebee; }
        .option-label { font-weight: 700; margin-right: 12px; min-width: 24px; color: #666; }
        .result-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .result-box { background: white; padding: 40px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; }
        .result-score { font-size: 3em; font-weight: 700; margin: 20px 0; }
        .result-stats { display: flex; justify-content: space-around; margin: 30px 0; }
        .stat-value { font-size: 2em; font-weight: 700; margin-bottom: 5px; }
        .stat-label { color: #999; font-size: 0.9em; }
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid #e5e5e5; display: flex; }
        .nav-item { flex: 1; padding: 16px; text-align: center; cursor: pointer; color: #999; font-weight: 600; }
        .nav-item.active { color: #2c2c2c; background: #fafafa; }
        .view { display: none; }
        .view.active { display: block; }
        .hidden { display: none !important; }
        .empty { text-align: center; padding: 60px 20px; color: #999; }
        .loading { text-align: center; padding: 20px; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <div id="add" class="view active">
        <h2>新增錯題</h2>
        <div class="form-group">
            <label>科目</label>
            <select id="subj">
                <option value="國文">國文</option>
                <option value="英文">英文</option>
                <option value="數學">數學</option>
                <option value="自然">自然</option>
                <option value="社會">社會</option>
            </select>
        </div>
        <div class="form-group">
            <label>題目圖片</label>
            <div class="file-wrapper">
                <div class="file-btn">選擇圖片</div>
                <input type="file" id="img" accept="image/*">
            </div>
            <img id="preview">
        </div>
        <div class="form-group">
            <label>題目內容</label>
            <textarea id="point" placeholder="題目或重點筆記"></textarea>
        </div>
        <div class="form-group">
            <label>正確答案</label>
            <input id="ans" placeholder="正確答案">
        </div>
        <button class="btn-primary" onclick="save()">儲存</button>
    </div>

    <div id="review" class="view">
        <h2>複習</h2>
        <div class="filter">
            <label>科目</label>
            <div class="chips">
                <div class="chip active" onclick="filter(this,'all')">全部</div>
                <div class="chip" onclick="filter(this,'國文')">國文</div>
                <div class="chip" onclick="filter(this,'英文')">英文</div>
                <div class="chip" onclick="filter(this,'數學')">數學</div>
                <div class="chip" onclick="filter(this,'自然')">自然</div>
                <div class="chip" onclick="filter(this,'社會')">社會</div>
            </div>
        </div>
        <div id="cards"></div>
    </div>

    <div id="exam" class="view">
        <div id="start">
            <h2>考試</h2>
            <div class="filter">
                <label>科目</label>
                <div class="chips">
                    <div class="chip active" onclick="filterE(this,'all')">全部</div>
                    <div class="chip" onclick="filterE(this,'國文')">國文</div>
                    <div class="chip" onclick="filterE(this,'英文')">英文</div>
                    <div class="chip" onclick="filterE(this,'數學')">數學</div>
                    <div class="chip" onclick="filterE(this,'自然')">自然</div>
                    <div class="chip" onclick="filterE(this,'社會')">社會</div>
                </div>
            </div>
            <div id="count" style="text-align:center; margin:20px 0; color:#999;"></div>
            <button class="btn-primary" onclick="startExam()">開始</button>
        </div>
        
        <div id="prog" class="hidden">
            <div class="exam-box">
                <div class="exam-header">
                    <span><b id="cur">1</b>/<span id="tot">0</span></span>
                    <span>✓<b id="cor">0</b> ✗<b id="wrg">0</b></span>
                </div>
                <img id="qimg" class="question-img hidden">
                <div id="qtxt" class="question-text"></div>
                <div id="opts" class="options"></div>
                <button class="btn-primary" onclick="submit()">送出</button>
                <button class="btn-secondary" onclick="skip()">跳過</button>
            </div>
        </div>
    </div>
</div>

<div class="nav">
    <div class="nav-item active" onclick="switchView('add',this)">新增</div>
    <div class="nav-item" onclick="switchView('review',this)">複習</div>
    <div class="nav-item" onclick="switchView('exam',this)">考試</div>
</div>

<script>
let imgData=null, rSubj='all', eSubj='all', qs=[], cur=0, cor=0, wrg=0, sel=null;

// 圖片
document.getElementById('img').onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev => {
        const i = new Image();
        i.onload = () => {
            const c = document.createElement('canvas'), ctx = c.getContext('2d');
            let w=i.width, h=i.height;
            if(w>800){h*=800/w; w=800;}
            c.width=w; c.height=h;
            ctx.drawImage(i,0,0,w,h);
            imgData = c.toDataURL('image/jpeg',0.6);
            document.getElementById('preview').src = imgData;
            document.getElementById('preview').style.display = 'block';
        };
        i.src = ev.target.result;
    };
    r.readAsDataURL(f);
};

// 背景生成選項
async function genOpts(q) {
    try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 500,
                messages: [{
                    role: 'user',
                    content: `${q.subject}題目：${q.point}\n正確答案：${q.answer}\n\n生成3個錯誤選項（如有注音要用注音）。回傳JSON：{"options":["選項1","選項2","選項3","${q.answer}"]}`
                }]
            })
        });
        const d = await res.json();
        let txt = d.content.find(c=>c.type==='text')?.text || '';
        txt = txt.replace(/```json|```/g,'').trim();
        const parsed = JSON.parse(txt);
        return parsed.options.sort(()=>Math.random()-0.5);
    } catch(e) {
        console.error(e);
        return null;
    }
}

// 儲存
async function save() {
    const s=document.getElementById('subj').value;
    const p=document.getElementById('point').value.trim();
    const a=document.getElementById('ans').value.trim();
    if(!p||!a) return alert('請填寫題目和答案');
    
    const q = {id:Date.now(), date:Date.now(), subject:s, point:p, answer:a, image:imgData};
    
    // 背景預生成
    genOpts(q).then(opts => {
        if(opts) q.options = opts;
        let data = JSON.parse(localStorage.getItem('db')||'[]');
        data.push(q);
        localStorage.setItem('db', JSON.stringify(data));
    });
    
    document.getElementById('point').value = '';
    document.getElementById('ans').value = '';
    document.getElementById('img').value = '';
    document.getElementById('preview').style.display = 'none';
    imgData = null;
    alert('已儲存（選項生成中）');
}

// 複習
function filter(el,s) {
    document.querySelectorAll('#review .chip').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    rSubj=s;
    renderCards();
}

function renderCards() {
    const cont = document.getElementById('cards');
    cont.innerHTML = '';
    let data = JSON.parse(localStorage.getItem('db')||'[]');
    const cut = Date.now()-14*24*60*60*1000;
    data = data.filter(d=>d.date>cut);
    if(rSubj!=='all') data = data.filter(d=>d.subject===rSubj);
    data.reverse();
    if(data.length===0){cont.innerHTML='<div class="empty">沒有錯題</div>'; return;}
    data.forEach(d=>{
        const card = document.createElement('div');
        card.className = 'card';
        const date = new Date(d.date).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit'});
        card.innerHTML = `
            <div class="card-header">
                <span class="subject-tag">${d.subject}</span>
                <span>${date}</span>
            </div>
            ${d.image?`<img src="${d.image}">`:''}
            <div style="margin-bottom:16px;">${d.point}</div>
            <button class="btn-secondary" onclick="toggleA(this)">顯示答案</button>
            <div class="answer-hidden">答案：${d.answer}</div>
        `;
        cont.appendChild(card);
    });
}

function toggleA(btn) {
    const a = btn.nextElementSibling;
    if(a.style.display==='block'){
        a.style.display='none';
        btn.textContent='顯示答案';
    }else{
        a.style.display='block';
        btn.textContent='隱藏答案';
    }
}

// 考試
function filterE(el,s) {
    document.querySelectorAll('#exam .chip').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    eSubj=s;
    updateC();
}

function updateC() {
    let data = JSON.parse(localStorage.getItem('db')||'[]');
    const cut = Date.now()-14*24*60*60*1000;
    data = data.filter(d=>d.date>cut);
    if(eSubj!=='all') data = data.filter(d=>d.subject===eSubj);
    document.getElementById('count').textContent = data.length===0?'沒有錯題':`共 ${data.length} 題`;
}

function startExam() {
    let data = JSON.parse(localStorage.getItem('db')||'[]');
    const cut = Date.now()-14*24*60*60*1000;
    data = data.filter(d=>d.date>cut);
    if(eSubj!=='all') data = data.filter(d=>d.subject===eSubj);
    if(data.length===0) return alert('沒有題目');
    qs = data.sort(()=>Math.random()-0.5);
    cur=0; cor=0; wrg=0;
    document.getElementById('start').classList.add('hidden');
    document.getElementById('prog').classList.remove('hidden');
    showQ();
}

async function showQ() {
    if(cur>=qs.length) return showR();
    const q = qs[cur];
    document.getElementById('cur').textContent = cur+1;
    document.getElementById('tot').textContent = qs.length;
    document.getElementById('cor').textContent = cor;
    document.getElementById('wrg').textContent = wrg;
    document.getElementById('qtxt').textContent = q.point;
    const qimg = document.getElementById('qimg');
    if(q.image){qimg.src=q.image; qimg.classList.remove('hidden');}
    else{qimg.classList.add('hidden');}
    sel=null;
    
    const opts = document.getElementById('opts');
    if(q.options){
        const lbl = ['A','B','C','D'];
        opts.innerHTML = q.options.map((o,i)=>
            `<div class="option" onclick="selectO(this,'${o.replace(/'/g,"\\'")}')">
                <span class="option-label">${lbl[i]}</span><span>${o}</span>
            </div>`
        ).join('');
    }else{
        opts.innerHTML = '<div class="loading">生成選項中...</div>';
        const newOpts = await genOpts(q);
        if(newOpts){
            q.options = newOpts;
            let data = JSON.parse(localStorage.getItem('db')||'[]');
            const idx = data.findIndex(d=>d.id===q.id);
            if(idx!==-1) data[idx] = q;
            localStorage.setItem('db',JSON.stringify(data));
            const lbl = ['A','B','C','D'];
            opts.innerHTML = newOpts.map((o,i)=>
                `<div class="option" onclick="selectO(this,'${o.replace(/'/g,"\\'")}')">
                    <span class="option-label">${lbl[i]}</span><span>${o}</span>
                </div>`
            ).join('');
        }else{
            opts.innerHTML = '<div class="loading">生成失敗</div>';
        }
    }
}

function selectO(el,opt) {
    document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
    el.classList.add('selected');
    sel=opt;
}

function submit() {
    if(!sel) return alert('請選擇答案');
    const q = qs[cur];
    const ok = sel.trim().toLowerCase()===q.answer.trim().toLowerCase();
    document.querySelectorAll('.option').forEach(o=>{
        const t = o.querySelector('span:last-child').textContent;
        if(t.trim().toLowerCase()===q.answer.trim().toLowerCase()) o.classList.add('correct');
        else if(o.classList.contains('selected')) o.classList.add('wrong');
        o.onclick=null;
    });
    if(ok) cor++; else wrg++;
    setTimeout(()=>{cur++; showQ();}, 1500);
}

function skip() {
    wrg++; cur++; showQ();
}

function showR() {
    const tot=qs.length, pct=Math.round((cor/tot)*100);
    const ov = document.createElement('div');
    ov.className = 'result-overlay';
    ov.innerHTML = `
        <div class="result-box">
            <h2>完成</h2>
            <div class="result-score">${pct}%</div>
            <div class="result-stats">
                <div><div class="stat-value" style="color:#4caf50;">${cor}</div><div class="stat-label">答對</div></div>
                <div><div class="stat-value" style="color:#f44336;">${wrg}</div><div class="stat-label">答錯</div></div>
                <div><div class="stat-value">${tot}</div><div class="stat-label">總數</div></div>
            </div>
            <button class="btn-primary" onclick="closeE()">完成</button>
        </div>
    `;
    document.body.appendChild(ov);
}

function closeE() {
    document.querySelector('.result-overlay')?.remove();
    document.getElementById('start').classList.remove('hidden');
    document.getElementById('prog').classList.add('hidden');
}

function switchView(id,el) {
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    if(id==='review') renderCards();
    if(id==='exam'){
        document.getElementById('start').classList.remove('hidden');
        document.getElementById('prog').classList.add('hidden');
        updateC();
    }
}

window.onload = updateC;
</script>
</body>
</html>
